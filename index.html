:root,:root[data-theme="light"]{--ink:#EFE6D9;--panel:#F7EFE2;--panel2:#E8DCC9;--line:#1B1A1714;--edge:#DCCDB6;--paper:#221F19;--muted:#7E7261;--signal:#C05B34;--onsig:#FBF5EA}
:root[data-theme="dark"]{--ink:#171614;--panel:#211F1C;--panel2:#2B2822;--line:#F4F0E814;--edge:#3A3630;--paper:#F1ECE2;--muted:#9A9184;--signal:#D4703F;--onsig:#171614}
:root[data-accent="blue"]{--signal:#2C4A78;--onsig:#F4F6F9}
:root[data-accent="green"]{--signal:#3E5C4B;--onsig:#F3F7F4}
:root[data-accent="pink"]{--signal:#8E2F4A;--onsig:#FBF4F6}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);-webkit-text-size-adjust:100%}
body{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;background-image:radial-gradient(120% 68% at 10% -6%, color-mix(in oklab, var(--signal) 22%, transparent) 0%, transparent 60%),radial-gradient(95% 55% at 100% 2%, color-mix(in oklab, #2C4A78 14%, transparent) 0%, transparent 55%),radial-gradient(80% 50% at 50% 108%, color-mix(in oklab, var(--signal) 12%, transparent) 0%, transparent 60%);background-attachment:fixed}
::selection{background:color-mix(in oklab, var(--signal) 28%, transparent)}
.rounded-xl,.rounded-2xl{box-shadow:0 14px 34px -26px rgba(34,31,25,.4)}
button{transition:transform 120ms ease, opacity 120ms ease}
button:active{transform:scale(.97)}
body{overscroll-behavior-y:none}
button{font:inherit;background:none;border:none;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@keyframes toastPop{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
input{font:inherit}
.flex{display:flex}.flex-col{flex-direction:column}.flex-1{flex:1 1 0%}
.items-center{align-items:center}.items-end{align-items:flex-end}.items-baseline{align-items:baseline}
.justify-between{justify-content:space-between}.justify-center{justify-content:center}.justify-end{justify-content:flex-end}
.gap-1{gap:.25rem}.gap-2{gap:.5rem}.gap-3{gap:.75rem}.gap-4{gap:1rem}.gap-6{gap:1.5rem}
.mt-2{margin-top:.5rem}.mt-4{margin-top:1rem}.mt-5{margin-top:1.25rem}.mt-6{margin-top:1.5rem}
.mt-7{margin-top:1.75rem}.mt-8{margin-top:2rem}.mt-10{margin-top:2.5rem}
.mx-auto{margin-left:auto;margin-right:auto}
.p-3{padding:.75rem}.p-4{padding:1rem}.p-5{padding:1.25rem}
.px-1{padding-left:.25rem;padding-right:.25rem}.px-3{padding-left:.75rem;padding-right:.75rem}
.px-4{padding-left:1rem;padding-right:1rem}.px-5{padding-left:1.25rem;padding-right:1.25rem}
.py-1{padding-top:.25rem;padding-bottom:.25rem}.py-2{padding-top:.5rem;padding-bottom:.5rem}
.py-3{padding-top:.75rem;padding-bottom:.75rem}.py-4{padding-top:1rem;padding-bottom:1rem}
.pt-6{padding-top:1.5rem}.pt-8{padding-top:2rem}.pt-10{padding-top:2.5rem}
.pb-8{padding-bottom:2rem}.pb-10{padding-bottom:2.5rem}
.rounded-sm{border-radius:.125rem}.rounded-md{border-radius:.375rem}
.rounded-lg{border-radius:.5rem}.rounded-xl{border-radius:.75rem}
.w-full{width:100%}.min-w-0{min-width:0}.min-h-screen{min-height:100vh}
.text-right{text-align:right}.uppercase{text-transform:uppercase}.underline{text-decoration:underline}
.active\:translate-y-px:active{transform:translateY(1px)}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

function clozeSentence(it) {

/* ---------- text helpers ---------- */
function fold(s) {
  return (s || "").toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/[.,!?;:"'’„“]/g, "").replace(/\s+/g, " ").trim();
}
function lev(a, b) {
  const m = a.length,
    n = b.length;
  if (Math.abs(m - n) > 2) return 3;
  let prev = new Array(n + 1);
  let cur = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
    }
    const t = prev;
    prev = cur;
    cur = t;
  }

}

function judge(input, target) {
  const a = fold(input),
    b = fold(target);
  if (!a) return "wrong";
  if (a === b) return "right";
  if (b.startsWith("der ") || b.startsWith("die ") || b.startsWith("das ")) {
    if (a === b.slice(4)) return "close"; // right noun, missing article
  }
  const d = lev(a, b);
  if (d <= 1 || b.length > 9 && d === 2) return "close";
  return "wrong";
}

// grade: 0 again, 1 hard, 2 good, 3 easy
function schedule(st, grade, now) {
  const s = {

  if (grade === 0) {
    s.lapses += 1;
    s.ef = Math.max(1.3, s.ef - 0.2);
    s.iv = 0;
    s.stage = "learning";
    s.due = now; // comes back inside this session
    return s;
  }
  if (s.stage === "new" || s.stage === "learning") {
    s.iv = grade === 3 ? 3 : grade === 2 ? 1 : 0.5;
    s.stage = "review";
  } else {
    const f = grade === 1 ? 1.2 : grade === 2 ? s.ef : s.ef * 1.35;
    s.iv = Math.max(1, Math.round(s.iv * f * 10) / 10);
  }
  s.ef = Math.max(1.3, Math.min(3.0, s.ef + (grade === 1 ? -0.14 : grade === 2 ? 0.02 : 0.12)));
  s.reps += 1;
  s.due = now + s.iv * DAY;
  return s;
}

  if (s.iv < 1) return "12 Std";
  if (s.iv === 1) return "1 Tag";
  if (s.iv < 30) return Math.round(s.iv) + " Tage";
  return Math.round(s.iv / 30) + " Mon";
}

    const db = await idbOpen();

        dailyOn: save.notif.dailyOn,
        dailyTime: save.notif.dailyTime,
        streakOn: save.notif.streakOn,
        lastNotified: save.notif.lastNotified,
        lastDay: save.lastDay,

/* ---------- speech ---------- */
function useSpeech() {
  const voice = useRef(null);
  useEffect(() => {
    if (typeof window === "undefined" || !window.speechSynthesis) return;
    const pick = () => {
      const vs = window.speechSynthesis.getVoices() || [];
      voice.current = vs.find(v => v.lang && v.lang.toLowerCase().startsWith("de")) || null;
    };
    pick();
    window.speechSynthesis.onvoiceschanged = pick;
  }, []);
  return useCallback((text, rate) => {
    if (typeof window === "undefined" || !window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE";
    u.rate = rate || 0.92;
    if (voice.current) u.voice = voice.current;
    window.speechSynthesis.speak(u);
  }, []);
}
